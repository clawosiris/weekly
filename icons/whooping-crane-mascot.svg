<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" role="img" aria-labelledby="title desc">
  <title id="title">Whooping crane mascot</title>
  <desc id="desc">A stylized white whooping crane with a red crown, black face mask, ivory beak, black wing tips, red tail feathers, and long dark legs.</desc>
  <defs>
    <linearGradient id="bodyShade" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.72" stop-color="#fbfbf4"/>
      <stop offset="1" stop-color="#dcecf2"/>
    </linearGradient>
    <linearGradient id="beakShade" x1="0" x2="1">
      <stop offset="0" stop-color="#f7f0bd"/>
      <stop offset="1" stop-color="#6f6748"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="10" flood-color="#1d2c34" flood-opacity="0.2"/>
    </filter>
    <style>
      .neck { animation: crane-neck 1.6s ease-in-out infinite alternate; transform-origin: 380px 278px; }
      .head { animation: crane-head 1.6s ease-in-out infinite alternate; transform-origin: 286px 102px; }
      .wing { animation: crane-wing 1.8s ease-in-out infinite alternate; transform-origin: 548px 292px; }
      .tail { animation: crane-tail 1.8s ease-in-out infinite alternate; transform-origin: 696px 332px; }
      .leg-front { animation: crane-leg-front 0.78s ease-in-out infinite alternate; transform-origin: 496px 438px; }
      .leg-back { animation: crane-leg-back 0.78s ease-in-out infinite alternate; transform-origin: 430px 440px; }
      @keyframes crane-neck { from { transform: rotate(-1deg); } to { transform: rotate(1.5deg) translateY(-4px); } }
      @keyframes crane-head { from { transform: rotate(0deg); } to { transform: rotate(-2deg) translateX(-4px); } }
      @keyframes crane-wing { from { transform: rotate(-1deg); } to { transform: rotate(2deg) translateY(3px); } }
      @keyframes crane-tail { from { transform: rotate(-1deg); } to { transform: rotate(3deg); } }
      @keyframes crane-leg-front { from { transform: rotate(3deg); } to { transform: rotate(-3deg); } }
      @keyframes crane-leg-back { from { transform: rotate(-3deg); } to { transform: rotate(3deg); } }
      @media (prefers-reduced-motion: reduce) {
        .neck, .head, .wing, .tail, .leg-front, .leg-back { animation: none; }
      }
    </style>
  </defs>

  <ellipse cx="476" cy="586" rx="236" ry="28" fill="#e8dcc1" opacity="0.8"/>
  <g filter="url(#softShadow)">
    <g class="leg-back">
      <path d="M434 420 C424 468 416 518 400 570" fill="none" stroke="#262827" stroke-width="13" stroke-linecap="round"/>
      <path d="M400 570 C378 572 360 582 350 600" fill="none" stroke="#262827" stroke-width="11" stroke-linecap="round"/>
      <path d="M400 570 C420 579 442 581 464 576" fill="none" stroke="#262827" stroke-width="9" stroke-linecap="round"/>
    </g>
    <g class="leg-front">
      <path d="M506 424 C512 476 512 526 500 584" fill="none" stroke="#343331" stroke-width="14" stroke-linecap="round"/>
      <path d="M500 584 C472 584 452 594 436 612" fill="none" stroke="#343331" stroke-width="11" stroke-linecap="round"/>
      <path d="M500 584 C522 596 548 600 574 592" fill="none" stroke="#343331" stroke-width="9" stroke-linecap="round"/>
      <path d="M500 584 C506 604 516 616 532 622" fill="none" stroke="#343331" stroke-width="8" stroke-linecap="round"/>
    </g>

    <g class="tail">
      <path d="M665 292 C736 306 786 345 820 420 C768 395 718 374 672 356 Z" fill="#d92333"/>
      <path d="M673 326 C724 349 756 382 778 430" fill="none" stroke="#8d1623" stroke-width="8" stroke-linecap="round"/>
      <path d="M696 334 C748 357 786 388 820 438" fill="none" stroke="#8d1623" stroke-width="7" stroke-linecap="round"/>
    </g>

    <path d="M323 280 C383 222 500 209 612 244 C692 268 726 306 704 344 C676 392 560 412 446 388 C338 366 278 324 323 280 Z" fill="url(#bodyShade)"/>
    <path d="M338 294 C384 383 478 438 584 424 C498 458 366 424 310 337 Z" fill="#dcecf2" opacity="0.78"/>
    <g class="wing">
      <path d="M470 252 C560 248 648 284 690 330 C624 322 562 324 510 350 C486 336 472 304 470 252 Z" fill="#ffffff"/>
      <path d="M600 324 C626 340 650 362 672 392 C636 380 604 360 574 334 Z" fill="#111315"/>
      <path d="M554 340 C586 360 604 386 620 420 C584 402 552 374 530 348 Z" fill="#111315"/>
      <path d="M506 344 C536 366 552 394 560 430 C526 410 498 382 482 350 Z" fill="#111315"/>
      <path d="M504 286 C560 276 620 292 664 323" fill="none" stroke="#dcecf2" stroke-width="10" stroke-linecap="round"/>
      <path d="M486 318 C542 314 592 326 635 352" fill="none" stroke="#c9dfe9" stroke-width="7" stroke-linecap="round"/>
    </g>

    <g class="neck">
      <path d="M346 300 C260 234 258 164 316 104 C348 72 389 68 422 86" fill="none" stroke="#d7eaf1" stroke-width="72" stroke-linecap="round"/>
      <path d="M350 286 C284 224 286 164 334 116 C360 90 390 88 414 102" fill="none" stroke="#ffffff" stroke-width="52" stroke-linecap="round"/>
    </g>

    <g class="head">
      <path d="M292 108 C330 60 398 54 442 94 C420 128 378 154 328 144 C306 140 288 130 292 108 Z" fill="#ffffff"/>
      <path d="M300 98 C334 52 394 48 434 82 C426 102 412 118 392 130 C360 118 330 109 300 98 Z" fill="#de2636"/>
      <path d="M266 112 C304 82 356 82 392 128 C350 148 304 142 276 126 Z" fill="#0d1011"/>
      <path d="M284 116 L92 202 L272 92 Z" fill="url(#beakShade)"/>
      <path d="M106 199 L284 124" fill="none" stroke="#1f2421" stroke-width="4" stroke-linecap="round"/>
      <path d="M166 164 L286 112" fill="none" stroke="#fff8cf" stroke-width="8" stroke-linecap="round"/>
      <ellipse cx="348" cy="99" rx="7" ry="8" fill="#ffffff"/>
      <circle cx="350" cy="99" r="3" fill="#1c2021"/>
      <path d="M370 136 C388 144 410 139 424 124" fill="none" stroke="#d7eaf1" stroke-width="18" stroke-linecap="round"/>
    </g>
  </g>
</svg>
